[project]
name = "ml"
version = "0.1.0"
description = "The Yellow Sign backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.127.0",
    "langchain>=1.1.0",
    "langchain-text-splitters>=1.0.0",
    "marko>=2.2.1",
    "openai>=2.14.0",
    "opensearch-py>=3.1.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.6.0",
    "pymilvus>=2.6.4",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "sentence-transformers>=5.2.0",
    "uvicorn[standard]>=0.38.0",
    "ragas>=0.4.2",
    "scipy>=1.16.3",
    "onnxruntime>=1.23.2",
    "optimum[onnxruntime]>=2.1.0",
    "gliner>=0.2.0", # Optional: zero-shot NER for metadata extraction
    "tavily-python>=0.7.19",
    "prometheus-client>=0.24.1",
    "tiktoken>=0.7.0",
    "tenacity>=9.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "C", "B", "Q", "S", "I", "D"]
ignore = [
    # Docstring rules
    "D100", "D104", "D105", "D107", "D211",
    # Formatting & spacing (D203 conflicts with formatter, D213 conflicts with D212)
    "D203", "D213"
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["S101", "D102", "D103"]
"demo_agent.py" = ["S101", "D101", "D102", "D103"]
"demo_prompts.py" = ["W293"]
"utils.py" = ["D103"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.1",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
