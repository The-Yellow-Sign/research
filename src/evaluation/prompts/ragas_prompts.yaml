prompts:
  statement_generator_prompt: |
    Дан вопрос и ответ. Разбей каждое предложение ответа на отдельные утверждения.
    Каждое утверждение должно быть полностью понятным без контекста.
    НЕ используй местоимения — заменяй их на конкретные сущности.
    
    ВАЖНО: Выведи JSON в формате {"statements": ["утверждение1", "утверждение2", ...]}.
    Каждое утверждение — СТРОКА, не объект.
    
    Пример:
    Вопрос: Как исправить OOM в Docker?
    Ответ: Контейнер падает с Exit Code 137. Нужно увеличить лимит памяти.
    Вывод: {"statements": ["Контейнер падает с Exit Code 137.", "Нужно увеличить лимит памяти для контейнера."]}

  nli_statement_prompt: |
    Твоя задача — оценить достоверность (faithfulness) утверждений на основе контекста.
    Для каждого утверждения верни verdict: 1, если утверждение МОЖНО вывести из контекста, или 0, если НЕТ.
    
    ВАЖНО: Выведи JSON в формате:
    {"statements": [{"statement": "текст утверждения", "reason": "причина вердикта", "verdict": 1}]}
    
    Правила:
    - verdict: 1 — утверждение явно следует из контекста или логически неизбежно
    - verdict: 0 — утверждение отсутствует в контексте, додумано, или противоречит ему
    - Для технических команд (bash, SQL) — если команда совпадает по смыслу, ставь 1
    
    Пример:
    Контекст: "PostgreSQL слушает порт 5432 по умолчанию."
    Утверждение: "PostgreSQL использует порт 5432."
    Вывод: {"statements": [{"statement": "PostgreSQL использует порт 5432.", "reason": "Явно указано в контексте.", "verdict": 1}]}

  context_recall_classification_prompt: |
    Дан контекст и ответ. Для каждого предложения ответа определи, можно ли его отнести к контексту.
    Используй бинарную классификацию: attributed = 1 (да) или 0 (нет).
    
    ВАЖНО: Выведи JSON в формате:
    {"classifications": [{"statement": "предложение", "reason": "причина", "attributed": 1}]}
    
    Правила:
    - attributed: 1 — предложение подтверждается контекстом (включая перефразировки и синонимы)
    - attributed: 0 — предложение НЕ подтверждается контекстом
    - Цифры, команды, параметры — ищи СМЫСЛОВОЕ совпадение, не буквальное
    
    Пример:
    Контекст: "Redis работает на порту 6379."
    Ответ: "Сервер Redis использует стандартный порт 6379."
    Вывод: {"classifications": [{"statement": "Сервер Redis использует стандартный порт 6379.", "reason": "Контекст подтверждает порт 6379.", "attributed": 1}]}

  context_precision_prompt: |
    Дан вопрос, ответ и контекст. Определи, был ли контекст полезен для получения ответа.
    
    ВАЖНО: Выведи JSON в формате:
    {"reason": "объяснение", "verdict": 1}
    
    Правила:
    - verdict: 1 — контекст помог ответить на вопрос (полностью или частично)
    - verdict: 0 — контекст не релевантен вопросу (другая технология, версия, тема)
    
    Пример:
    Вопрос: "Как увеличить max_connections в MySQL?"
    Контекст: "SET GLOBAL max_connections = 500;"
    Ответ: "Выполните SET GLOBAL max_connections = 500."
    Вывод: {"reason": "Контекст содержит точную команду для ответа.", "verdict": 1}

# Промпты для агентных метрик
agent_prompts:
  compare_outcome_prompt: |
    Дана цель пользователя, ожидаемый результат и достигнутый результат.
    Сравни их и определи, совпадают ли они.
    
    ВАЖНО: Выведи JSON в формате:
    {"reason": "объяснение сравнения", "verdict": 1}
    
    Правила:
    - verdict: 1 — достигнутый результат соответствует ожидаемому (полностью или по сути)
    - verdict: 0 — результаты НЕ совпадают (другой ответ, ошибка, неполный результат)
    
    При оценке учитывай:
    - Смысловое совпадение важнее буквального
    - Технически эквивалентные решения считаются совпадающими
    - Если агент выполнил задачу другим способом, но результат правильный — verdict: 1
    
    Пример:
    Цель: "Узнать как настроить репликацию PostgreSQL"
    Ожидаемый результат: "Настроить wal_level=replica и создать слот репликации"
    Достигнутый результат: "Нужно установить wal_level=replica в postgresql.conf"
    Вывод: {"reason": "Частично выполнено - указан wal_level, но слот не упомянут", "verdict": 0}

  infer_goal_outcome_prompt: |
    Дан рабочий процесс агента, включающий сообщения пользователя, ИИ и результаты инструментов.
    Определи цель пользователя и достигнутый результат.
    
    ВАЖНО: Выведи JSON в формате:
    {"user_goal": "цель пользователя", "achieved_outcome": "что было достигнуто"}
    
    Правила:
    - user_goal — конкретная задача, которую хотел решить пользователь
    - achieved_outcome — фактический результат работы агента
    
    При анализе:
    - Извлекай цель из первого сообщения пользователя
    - Результат определяй по последнему ответу агента и использованным инструментам
    - Если агент вернул ошибку или не смог ответить — achieved_outcome должен это отражать
    
    Пример:
    Workflow: [User: "Как исправить 502 ошибку?", AI вызвал rag_search, AI: "Проверьте статус бэкенда..."]
    Вывод: {"user_goal": "Узнать как исправить 502 ошибку в Nginx", "achieved_outcome": "Предоставлены шаги диагностики бэкенда"}