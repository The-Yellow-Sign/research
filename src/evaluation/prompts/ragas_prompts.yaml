prompts:
  faithfulness_prompt: |
    Ты — безжалостный верификатор фактов (Fact Checker). Твоя цель — найти ЛЮБОЕ несоответствие между ответом и контекстом.
    
    Вводные данные:
    Вопрос: {question}
    Контекст: {context}
    Ответ: {answer}
    
    ## ИНСТРУКЦИЯ ПО ШАГАМ:
    1. Выдели каждое утверждение (claim) из "Ответа".
    2. Для каждого утверждения найди доказательство в "Контексте".
    3. Если утверждение отсутствует в контексте или противоречит ему — это verdict: 0.
    4. Если утверждение есть в контексте (даже перефразированное) — это verdict: 1.
    
    ## РУБРИКА (RUBRIC):
    - verdict 1: Факт явно упомянут в контексте или логически неизбежно следует из него.
    - verdict 0: Факт не упомянут, додуман моделью, является "общим знанием" (но нет в контексте), или неверен.
    
    ## ПРИМЕРЫ ДЛЯ ПОДРАЖАНИЯ:
    Контекст: "Nginx слушает порт 80." | Ответ: "Nginx использует порт 8080." -> verdict: 0
    Контекст: "Python медленный." | Ответ: "Python — интерпретируемый язык." -> verdict: 0 (Правда, но нет в контексте)
    
    Формат вывода (JSON):
    {{
        "statements": [
            {{
                "statement": "Текст утверждения",
                "verdict": 1,
                "reason": "Прямая цитата: '...'"
            }},
             {{
                "statement": "Другое утверждение",
                "verdict": 0,
                "reason": "В контексте не указан порт."
            }}
        ]
    }}
    
    ВАЖНО: Отвечай ТОЛЬКО валидным JSON. Не добавляй markdown.

  context_recall_prompt: |
    Оцени, содержит ли контекст информацию, необходимую для составления эталонного ответа.
    
    Эталонный ответ: {ground_truth}
    Контекст: {context}
    
    ## ИНСТРУКЦИЯ:
    1. Разбей эталонный ответ на ключевые факты (1-3 факта).
    2. Для каждого факта проверь: есть ли эквивалентная информация в контексте?
    3. Используй СМЫСЛОВОЕ сопоставление (не буквальное). Синонимы и перефразировки считаются совпадением.
    
    ## ПРИМЕРЫ СМЫСЛОВОГО СОПОСТАВЛЕНИЯ:
    - Эталон: "Используется Redis Queue" | Контекст: "RQ на базе Redis" → attributed: 1
    - Эталон: "Нужно выполнить kubectl cordon" | Контекст: "Запретить планирование через cordon" → attributed: 1
    - Эталон: "Параметр listen_addresses" | Контекст: "В документе не упоминается данный параметр" → attributed: 0
    
    ## ФОРМАТ ВЫВОДА (JSON):
    {{"statements": [{{"statement": "Факт из эталона", "attributed": 1, "reason": "Найдено: '...'"}}]}}
    
    Отвечай ТОЛЬКО валидным JSON.

  context_precision_prompt: |
    Ты оцениваешь качество поиска. Полезен ли этот фрагмент контекста для ответа на вопрос?
    
    Вопрос: {question}
    Контекст: {context}
    
    ## АЛГОРИТМ ОЦЕНКИ:
    1. Внимательно прочитай вопрос.
    2. Если контекст помогает ответить на вопрос (даже частично) — verdict: 1.
    3. Если контекст про другую технологию, другую версию или просто вода — verdict: 0.
    
    Формат вывода (JSON):
    {{
        "reason": "Объяснение, почему контекст релевантен или нет",
        "verdict": 1
    }}
    
    ВАЖНО: Отвечай ТОЛЬКО валидным JSON.

  answer_relevancy_prompt: |
    Твоя задача — прочитать ответ и сформулировать вопрос, на который этот ответ отвечает.
    
    Ответ: {answer}
    
    ## ИНСТРУКЦИЯ:
    1. Прочитай ответ целиком.
    2. Сформулируй короткий технический вопрос на РУССКОМ языке, на который этот ответ отвечает.
    3. Вопрос должен быть конкретным и техническим (про команды, параметры, настройки).
    4. Если ответ пустой, бессмысленный или содержит "Я не знаю" / "отсутствует информация" — ставь non_committal: 1.
    
    ## ПРИМЕРЫ:
    
    Ответ: "Для перезагрузки подов используйте kubectl rollout restart deployment/myapp."
    Вывод: {{"question": "Как перезагрузить поды в Kubernetes?", "non_committal": 0}}
    
    Ответ: "Используется Redis в качестве брокера для очереди задач (RQ)."
    Вывод: {{"question": "Какую технологию использует сервис для очереди задач?", "non_committal": 0}}
    
    Ответ: "Рекомендуется использовать sstableloader для загрузки данных при изменении топологии кластера."
    Вывод: {{"question": "Какой инструмент использовать для восстановления Cassandra при изменении топологии?", "non_committal": 0}}
    
    Ответ: "В базе знаний отсутствует информация по данному запросу."
    Вывод: {{"question": "", "non_committal": 1}}
    
    ## ФОРМАТ ВЫВОДА (только JSON, без markdown):
    {{"question": "Ваш вопрос здесь", "non_committal": 0}}